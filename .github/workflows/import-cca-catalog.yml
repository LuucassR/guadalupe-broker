name: Importar catalogo de autos (CCA)

# Bot mensual: descarga la Lista de Precios de la CCA y actualiza
# VehicleCatalogCache. Corre en GitHub Actions (no en el hosting de la app)
# para que el import siga funcionando sin importar donde este deployada la
# app - ver docs/vehicle-valuation.md.
on:
  schedule:
    - cron: "0 6 2 * *" # dia 2 de cada mes, 06:00 UTC (da un dia de margen a que la CCA publique)
  workflow_dispatch: {} # permite correrlo a mano desde la pestana Actions

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Correr importador
        run: pnpm run import:cca
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
